name: Auditoría del currículo

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  auditoria:
    name: Validar estructura de fases y lecciones
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Auditar lecciones (estructura)
        run: python3 scripts/auditar_lecciones.py

      - name: Validar frontmatter y nombres
        run: python3 scripts/validar_frontmatter.py

      - name: Validar bloques de código y Mermaid
        run: python3 scripts/validar_bloques_codigo.py

      - name: Detectar referencias rotas
        run: python3 scripts/validar_enlaces.py

  pruebas:
    name: Ejecutar tests de las lecciones
    needs: auditoria
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias mínimas
        run: pip install numpy pytest

      - name: Probar todas las lecciones
        run: python3 scripts/probar_lecciones.py --quiet

  conteo:
    name: Sincronizar conteo de lecciones (solo main)
    needs: auditoria
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerar contadores en README y ROADMAP
        run: python3 scripts/actualizar_conteo.py --write

      - name: Commitear cambios
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md ROADMAP.md
            git commit -m "chore: sincronizar conteo de lecciones"
            git push
          else
            echo "Sin cambios en README.md ni ROADMAP.md"
          fi
