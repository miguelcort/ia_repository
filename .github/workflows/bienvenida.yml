name: Bienvenida

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull_requests: write

jobs:
  saludo:
    runs-on: ubuntu-latest
    steps:
      - name: Saludar en issues
        if: github.event_name == 'issues'
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 ¡Gracias por abrir un issue!

            Por favor incluye:
            - Fase y número de lección afectados (p. ej. `fase-02/03`).
            - Pasos para reproducir el problema.
            - Salida esperada vs. salida real.

            Lee [CONTRIBUTING.md](../../blob/main/CONTRIBUTING.md) antes
            de enviar un PR.
          pr-message: |
            👋 ¡Gracias por el PR!

            Por favor verifica:
            - [ ] Una lección = un commit.
            - [ ] Asunto `feat(fase-NN/MM): <slug>`.
            - [ ] `docs/es.md` con frontmatter completo.
            - [ ] `code/main.<lang>` ejecuta con `python3 main.py` y termina con código 0.
            - [ ] 5+ tests pasando.
